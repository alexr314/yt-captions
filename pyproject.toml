[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-captions"
version = "0.1.0"
description = "Read YouTube transcripts from the command line — an agent-shaped CLI for captions, not a downloader."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Roman" }]
keywords = ["youtube", "transcript", "captions", "cli", "subtitles", "llm", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]
dependencies = ["youtube-transcript-api>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/alexr314/yt-captions"
Repository = "https://github.com/alexr314/yt-captions"
Issues = "https://github.com/alexr314/yt-captions/issues"

[project.scripts]
yt = "yt_captions.cli:run"

[dependency-groups]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_captions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
